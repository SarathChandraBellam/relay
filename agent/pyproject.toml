[project]
name = "relay-agent"
version = "0.1.0"
description = "A Deep Agents harness served over the AG-UI protocol"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "ag-ui-langgraph>=0.0.47",
    "copilotkit>=0.1.96",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
relay-agent = "relay_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_agent"]
